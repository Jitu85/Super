<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <rect width="500" height="320" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Concentric circles centre (250, 160) -->
  <circle cx="250" cy="160" r="120" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="250" cy="160" r="60" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <!-- Chord AB touching inner circle at C(250, 100) -->
  <line x1="146" y1="100" x2="354" y2="100" stroke="#2563eb" stroke-width="3"/>
  <!-- Radii -->
  <line x1="250" y1="160" x2="250" y2="100" stroke="#ef4444" stroke-width="2"/>
  <line x1="250" y1="160" x2="354" y2="100" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Diameter / Secant line BD -->
  <line x1="354" y1="100" x2="370" y2="160" stroke="#d97706" stroke-width="2"/>
  <!-- Points -->
  <circle cx="250" cy="160" r="4" fill="#1e293b"/>
  <circle cx="250" cy="100" r="4" fill="#ef4444"/>
  <circle cx="146" cy="100" r="4" fill="#1e293b"/>
  <circle cx="354" cy="100" r="4" fill="#1e293b"/>
  <circle cx="370" cy="160" r="4" fill="#d97706"/>
  <!-- Labels -->
  <text x="255" y="175" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">O</text>
  <text x="245" y="88" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ef4444">C</text>
  <text x="130" y="95" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">A</text>
  <text x="365" y="95" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">B</text>
  <text x="380" y="165" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#d97706">D</text>
  <text x="310" y="210" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#2563eb">BD = 2 cm</text>
</svg>