<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <rect width="500" height="320" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="2"/>
  <polygon points="250,50 90,260 410,260" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5"/>
  <!-- DE || BC: D is 1/3 down AB, E is 1/3 down AC -->
  <line x1="197" y1="120" x2="303" y2="120" stroke="#2563eb" stroke-width="3"/>
  <circle cx="250" cy="50" r="4" fill="#1e293b"/>
  <circle cx="90" cy="260" r="4" fill="#1e293b"/>
  <circle cx="410" cy="260" r="4" fill="#1e293b"/>
  <circle cx="197" cy="120" r="4" fill="#2563eb"/>
  <circle cx="303" cy="120" r="4" fill="#2563eb"/>
  <text x="245" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">A</text>
  <text x="70" y="270" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">B</text>
  <text x="420" y="270" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">C</text>
  <text x="175" y="115" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#2563eb">D</text>
  <text x="315" y="115" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#2563eb">E</text>
  <text x="180" y="85" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">AD = 1.5 cm</text>
  <text x="110" y="190" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">DB = 3 cm</text>
  <text x="330" y="190" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">EC = 2 cm</text>
  <text x="260" y="90" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#d97706">AE = 1 cm</text>
  <text x="250" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#2563eb">AC = AE + EC = 3 cm</text>
</svg>