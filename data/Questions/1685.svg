<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <rect width="500" height="320" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="2"/>
  <polygon points="100,260 250,50 400,260" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5"/>
  <!-- PQ || AC (base AC is at bottom or side) -->
  <line x1="160" y1="180" x2="340" y2="180" stroke="#2563eb" stroke-width="3"/>
  <circle cx="250" cy="50" r="4" fill="#1e293b"/>
  <circle cx="100" cy="260" r="4" fill="#1e293b"/>
  <circle cx="400" cy="260" r="4" fill="#1e293b"/>
  <circle cx="160" cy="180" r="4" fill="#2563eb"/>
  <circle cx="340" cy="180" r="4" fill="#2563eb"/>
  <text x="245" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">B</text>
  <text x="80" y="270" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">A</text>
  <text x="410" y="270" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">C</text>
  <text x="140" y="180" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#2563eb">P</text>
  <text x="350" y="180" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#2563eb">Q</text>
  <text x="180" y="110" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">BP = 4 cm</text>
  <text x="100" y="220" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">AP = 2.4 cm</text>
  <text x="310" y="110" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">BQ = 5 cm</text>
  <text x="250" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#2563eb">BC = 8 cm</text>
</svg>