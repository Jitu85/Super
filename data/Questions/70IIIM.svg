<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" width="100%" height="100%">
  <rect width="340" height="180" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="170" y="32" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#451a03">Chocolate Bar (12 Equal Pieces)</text>
  <!-- 3x4 grid -->
  <!-- Row 1 -->
  <rect x="50" y="45" width="55" height="28" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
  <rect x="110" y="45" width="55" height="28" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
  <rect x="170" y="45" width="55" height="28" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
  <rect x="230" y="45" width="55" height="28" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
  <!-- Row 2 -->
  <rect x="50" y="78" width="55" height="28" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
  <rect x="110" y="78" width="55" height="28" fill="#fde68a" stroke="#78350f" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="170" y="78" width="55" height="28" fill="#fde68a" stroke="#78350f" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="230" y="78" width="55" height="28" fill="#fde68a" stroke="#78350f" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Row 3 -->
  <rect x="50" y="111" width="55" height="28" fill="#fde68a" stroke="#78350f" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="110" y="111" width="55" height="28" fill="#fde68a" stroke="#78350f" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="170" y="111" width="55" height="28" fill="#fde68a" stroke="#78350f" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="230" y="111" width="55" height="28" fill="#fde68a" stroke="#78350f" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="170" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#78350f">Dark = 5 eaten, Light = 7 remaining (7/12 &gt; 1/2)</text>
</svg>