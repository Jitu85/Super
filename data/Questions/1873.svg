<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <rect width="500" height="320" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Setup (I): Plant with KOH in Glass Bell Jar -->
  <g transform="translate(130, 160)">
    <!-- Glass Plate Base -->
    <rect x="-90" y="80" width="180" height="10" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <!-- Glass Bell Jar (Transparent Dome) -->
    <path d="M -75,80 L -75, -20 C -75,-80 75,-80 75,-20 L 75,80 Z" fill="#e0f2fe" fill-opacity="0.5" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="0" cy="-85" r="8" fill="#0284c7"/>
    <!-- Pot and Plant -->
    <polygon points="-25,80 25,80 30,50 -30,50" fill="#b45309"/>
    <!-- Plant stem & leaves -->
    <line x1="0" y1="50" x2="0" y2="0" stroke="#15803d" stroke-width="4"/>
    <ellipse cx="-15" cy="20" rx="15" ry="8" fill="#22c55e" transform="rotate(-25 -15 20)"/>
    <ellipse cx="15" cy="10" rx="15" ry="8" fill="#22c55e" transform="rotate(25 15 10)"/>
    <!-- Watch glass with KOH -->
    <path d="M 35,78 Q 50,85 65,78 Z" fill="#93c5fd" stroke="#1e293b"/>
    <text x="50" y="72" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e293b" text-anchor="middle">KOH</text>
    <text x="0" y="115" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Setup (I)</text>
  </g>

  <!-- Setup (II): Plant without KOH in Glass Bell Jar -->
  <g transform="translate(370, 160)">
    <rect x="-90" y="80" width="180" height="10" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <path d="M -75,80 L -75, -20 C -75,-80 75,-80 75,-20 L 75,80 Z" fill="#e0f2fe" fill-opacity="0.5" stroke="#0284c7" stroke-width="2.5"/>
    <circle cx="0" cy="-85" r="8" fill="#0284c7"/>
    <polygon points="-25,80 25,80 30,50 -30,50" fill="#b45309"/>
    <line x1="0" y1="50" x2="0" y2="0" stroke="#15803d" stroke-width="4"/>
    <ellipse cx="-15" cy="20" rx="15" ry="8" fill="#22c55e" transform="rotate(-25 -15 20)"/>
    <ellipse cx="15" cy="10" rx="15" ry="8" fill="#22c55e" transform="rotate(25 15 10)"/>
    <text x="0" y="115" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Setup (II)</text>
  </g>
  <text x="250" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">Bell Jar Experiment for Photosynthesis (Requires Glass Jars, Vaseline Seal)</text>
</svg>