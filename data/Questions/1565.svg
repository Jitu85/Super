<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <rect width="500" height="320" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Circle centre O(250, 160), r = 90 -->
  <circle cx="250" cy="160" r="90" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Diameter MN along horizontal -->
  <line x1="160" y1="160" x2="340" y2="160" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Point L on bottom of circle at (250, 250) -->
  <line x1="160" y1="160" x2="250" y2="250" stroke="#2563eb" stroke-width="2"/>
  <line x1="340" y1="160" x2="250" y2="250" stroke="#2563eb" stroke-width="2"/>
  <!-- Tangent RS at L -->
  <line x1="100" y1="250" x2="400" y2="250" stroke="#ef4444" stroke-width="3"/>
  <!-- Points -->
  <circle cx="250" cy="160" r="4" fill="#1e293b"/>
  <circle cx="160" cy="160" r="4" fill="#1e293b"/>
  <circle cx="340" cy="160" r="4" fill="#1e293b"/>
  <circle cx="250" cy="250" r="4" fill="#ef4444"/>
  <!-- Labels -->
  <text x="140" y="165" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">M</text>
  <text x="350" y="165" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">N</text>
  <text x="250" y="150" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">O</text>
  <text x="245" y="275" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ef4444">L</text>
  <text x="80" y="255" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ef4444">R</text>
  <text x="410" y="255" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ef4444">S</text>
  <text x="180" y="180" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2563eb">∠NML = 30°</text>
  <text x="150" y="240" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ef4444">∠RLM = 60°</text>
</svg>