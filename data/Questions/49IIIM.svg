<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="160" cy="85" r="65" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <!-- Hour markings -->
  <circle cx="160" cy="30" r="3.5" fill="#1e293b"/>
  <text x="160" y="42" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">12</text>
  <circle cx="215" cy="85" r="3.5" fill="#1e293b"/>
  <text x="210" y="89" text-anchor="end" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">3</text>
  <circle cx="160" cy="140" r="3.5" fill="#1e293b"/>
  <text x="160" y="136" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">6</text>
  <circle cx="105" cy="85" r="3.5" fill="#1e293b"/>
  <text x="110" y="89" text-anchor="start" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e293b">9</text>
  <!-- Center & Hands for 3:00 moving to 6 -->
  <circle cx="160" cy="85" r="5" fill="#b45309"/>
  <line x1="160" y1="85" x2="198" y2="85" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <line x1="160" y1="85" x2="160" y2="42" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Dashed sweep to 6 -->
  <path d="M 160 42 A 43 43 0 0 1 160 128" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,4"/>
  <polygon points="160,128 155,120 165,120" fill="#f59e0b"/>
  <text x="160" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">Minute hand moves 3:00 to 3:30 (30 mins)</text>
</svg>