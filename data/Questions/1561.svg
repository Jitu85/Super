<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <rect width="500" height="320" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Trapezoid PQRS with PQ || SR -->
  <polygon points="120,80 380,80 440,240 60,240" fill="#f1f5f9" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Diagonals meeting at O -->
  <line x1="120" y1="80" x2="440" y2="240" stroke="#2563eb" stroke-width="2"/>
  <line x1="380" y1="80" x2="60" y2="240" stroke="#2563eb" stroke-width="2"/>
  <!-- Points -->
  <circle cx="120" cy="80" r="4" fill="#1e293b"/>
  <circle cx="380" cy="80" r="4" fill="#1e293b"/>
  <circle cx="440" cy="240" r="4" fill="#1e293b"/>
  <circle cx="60" cy="240" r="4" fill="#1e293b"/>
  <circle cx="250" cy="145" r="4" fill="#ef4444"/>
  <!-- Labels -->
  <text x="105" y="75" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">P</text>
  <text x="390" y="75" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Q</text>
  <text x="450" y="250" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">R</text>
  <text x="40" y="250" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">S</text>
  <text x="255" y="140" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ef4444">O</text>
  <!-- Segment expressions -->
  <text x="150" y="120" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2563eb">PO = x + 5</text>
  <text x="320" y="120" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2563eb">QO = x - 1</text>
  <text x="120" y="200" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2563eb">SO = x - 2</text>
  <text x="310" y="200" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2563eb">RO = x + 3</text>
  <text x="250" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#d97706">PQ || SR  ⇒  x = 7</text>
</svg>