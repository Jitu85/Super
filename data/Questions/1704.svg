<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <rect width="500" height="320" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="2"/>
  <polygon points="250,50 90,260 410,260" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5"/>
  <line x1="170" y1="155" x2="330" y2="155" stroke="#2563eb" stroke-width="3"/>
  <circle cx="250" cy="50" r="4" fill="#1e293b"/>
  <circle cx="90" cy="260" r="4" fill="#1e293b"/>
  <circle cx="410" cy="260" r="4" fill="#1e293b"/>
  <circle cx="170" cy="155" r="4" fill="#2563eb"/>
  <circle cx="330" cy="155" r="4" fill="#2563eb"/>
  <text x="245" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">A</text>
  <text x="70" y="270" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">B</text>
  <text x="420" y="270" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">C</text>
  <text x="150" y="150" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#2563eb">D</text>
  <text x="340" y="150" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#2563eb">E</text>
  <text x="150" y="105" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">AD = x</text>
  <text x="100" y="210" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">DB = x - 2</text>
  <text x="300" y="105" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">AE = x + 2</text>
  <text x="375" y="210" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">EC = x - 1</text>
  <text x="250" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#2563eb">DE || BC  ⇒  x = 10</text>
</svg>