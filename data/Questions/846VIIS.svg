<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" width="100%" height="100%" style="max-height:200px; display:block; margin:auto;">
  <defs>
    <style>
      .txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #1E293B; }
      .txt-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: bold; fill: #0F172A; }
      .txt-sm { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; fill: #475569; }
      .line-main { stroke: #1E293B; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .line-accent { stroke: #2563EB; stroke-width: 2; fill: none; stroke-linecap: round; }
      .shape-fill { fill: #F1F5F9; stroke: #1E293B; stroke-width: 2; }
      .shape-accent { fill: #DBEAFE; stroke: #2563EB; stroke-width: 2; }
      .shape-gold { fill: #FEF3C7; stroke: #D97706; stroke-width: 2; }
      .shape-green { fill: #DCFCE7; stroke: #16A34A; stroke-width: 2; }
    </style>
  </defs>

  <!-- Tug of War Forces -->
  <circle cx="110" cy="85" r="14" class="shape-fill" />
  <line x1="110" y1="85" x2="35" y2="85" stroke="#2563EB" stroke-width="3" />
  <polygon points="30,85 45,78 45,92" fill="#2563EB" />
  <line x1="110" y1="85" x2="175" y2="85" stroke="#EF4444" stroke-width="3" />
  <polygon points="180,85 165,78 165,92" fill="#EF4444" />
  <text x="35" y="70" class="txt-bold" fill="#2563EB">Team A (200 N)</text>
  <text x="125" y="70" class="txt-bold" fill="#EF4444">Team B (150 N)</text>
  <text x="65" y="135" class="txt-bold">Net Force = 50 N (Left)</text>

</svg>