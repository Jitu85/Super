<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- (1) Railway | (2) Star -->
  <g font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="60" y="20">(1)</text>
    <text x="180" y="20">(2)</text>
  </g>
  <!-- (1) Railway -->
  <g transform="translate(60, 44)" stroke="#111111" stroke-width="2">
    <line x1="-42" y1="0" x2="42" y2="0"/>
    <line x1="-36" y1="-6" x2="-36" y2="6"/>
    <line x1="-24" y1="-6" x2="-24" y2="6"/>
    <line x1="-12" y1="-6" x2="-12" y2="6"/>
    <line x1="0" y1="-6" x2="0" y2="6"/>
    <line x1="12" y1="-6" x2="12" y2="6"/>
    <line x1="24" y1="-6" x2="24" y2="6"/>
    <line x1="36" y1="-6" x2="36" y2="6"/>
  </g>
  <!-- (2) Star -->
  <polygon points="180,32 184,41 193,41 186,47 188,56 180,51 172,56 174,47 167,41 176,41" fill="#111111"/>
</svg>
