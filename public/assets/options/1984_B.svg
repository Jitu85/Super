<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- (1) River | (2) Square in Square -->
  <g font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="60" y="20">(1)</text>
    <text x="180" y="20">(2)</text>
  </g>
  <!-- (1) River -->
  <path d="M20,44 Q35,34 50,44 T80,44 T100,44" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round"/>
  <!-- (2) Square in square -->
  <g transform="translate(180, 44)" stroke="#111111" stroke-width="2" fill="none">
    <rect x="-10" y="-10" width="20" height="20"/>
    <rect x="-5" y="-5" width="10" height="10"/>
  </g>
</svg>
