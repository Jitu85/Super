<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- (1) House | (2) Hollow Circle -->
  <g font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="60" y="20">(1)</text>
    <text x="180" y="20">(2)</text>
  </g>
  <!-- (1) House -->
  <g transform="translate(60, 44)" stroke="#222222" stroke-width="2" fill="none" stroke-linejoin="round">
    <rect x="-14" y="-6" width="28" height="20" fill="#888888"/>
    <polygon points="-18,-6 0,-20 18,-6" fill="#555555"/>
    <rect x="-4" y="2" width="8" height="12" fill="#ffffff"/>
  </g>
  <!-- (2) Hollow Circle -->
  <circle cx="180" cy="44" r="7" fill="none" stroke="#111111" stroke-width="2.2"/>
</svg>
