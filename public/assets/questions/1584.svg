<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <rect width="500" height="320" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Circle centre (250, 150), r = 100 -->
  <circle cx="250" cy="150" r="100" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <!-- Minor segment shaded: Chord from (179, 221) to (321, 221) -->
  <path d="M 179.3,220.7 A 100 100 0 0 0 320.7,220.7 Z" fill="#93c5fd" stroke="#2563eb" stroke-width="2.5"/>
  <!-- Chord AB -->
  <line x1="179.3" y1="220.7" x2="320.7" y2="220.7" stroke="#1e293b" stroke-width="3"/>
  <!-- Points -->
  <circle cx="250" cy="150" r="4" fill="#1e293b"/>
  <circle cx="179.3" cy="220.7" r="4" fill="#1e293b"/>
  <circle cx="320.7" cy="220.7" r="4" fill="#1e293b"/>
  <!-- Labels -->
  <text x="255" y="145" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">O</text>
  <text x="160" y="230" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">A</text>
  <text x="330" y="230" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">B</text>
  <text x="250" y="242" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">Minor Segment (Shaded)</text>
  <text x="250" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#64748b">Major Segment</text>
</svg>