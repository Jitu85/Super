<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <rect width="500" height="320" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Concentric Circles -->
  <circle cx="250" cy="160" r="115" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="250" cy="160" r="60" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <!-- Point P on outer circle at (135, 160) -->
  <circle cx="135" cy="160" r="5" fill="#ef4444"/>
  <text x="115" y="165" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ef4444">P</text>
  <!-- Two tangents to inner circle -->
  <line x1="135" y1="160" x2="280" y2="102" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="135" y1="160" x2="280" y2="218" stroke="#2563eb" stroke-width="2.5"/>
  <!-- Centre O -->
  <circle cx="250" cy="160" r="4" fill="#1e293b"/>
  <text x="255" y="155" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e293b">O</text>
  <!-- Legend -->
  <text x="250" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#334155">Tangents from point P on outer circle to inner circle: Exactly 2</text>
</svg>