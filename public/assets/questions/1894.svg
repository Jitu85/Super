<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <rect width="500" height="320" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Stomatal Apparatus -->
  <!-- Epidermal cells surrounding -->
  <g fill="#f1f5f9" stroke="#94a3b8" stroke-width="2">
    <path d="M 60,80 Q 150,60 170,120 Q 120,160 60,140 Z"/>
    <path d="M 60,140 Q 130,160 170,200 Q 120,260 60,240 Z"/>
    <path d="M 440,80 Q 350,60 330,120 Q 380,160 440,140 Z"/>
    <path d="M 440,140 Q 370,160 330,200 Q 380,260 440,240 Z"/>
  </g>
  <!-- Subsidiary cells -->
  <path d="M 170,90 Q 210,80 250,80 Q 290,80 330,90 Q 310,130 310,160 Q 310,190 330,230 Q 250,240 170,230 Q 190,190 190,160 Q 190,130 170,90 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <!-- Two bean-shaped Guard Cells (IV) -->
  <path d="M 250,100 C 210,100 200,140 200,160 C 200,180 210,220 250,220 C 235,195 235,125 250,100 Z" fill="#86efac" stroke="#16a34a" stroke-width="3"/>
  <path d="M 250,100 C 290,100 300,140 300,160 C 300,180 290,220 250,220 C 265,195 265,125 250,100 Z" fill="#86efac" stroke="#16a34a" stroke-width="3"/>
  <!-- Chloroplasts inside guard cells -->
  <circle cx="218" cy="140" r="4" fill="#15803d"/>
  <circle cx="215" cy="165" r="4" fill="#15803d"/>
  <circle cx="222" cy="185" r="4" fill="#15803d"/>
  <circle cx="282" cy="140" r="4" fill="#15803d"/>
  <circle cx="285" cy="165" r="4" fill="#15803d"/>
  <circle cx="278" cy="185" r="4" fill="#15803d"/>
  <!-- Stomatal Pore in center -->
  <ellipse cx="250" cy="160" rx="12" ry="30" fill="#0f172a"/>
  <!-- Labels -->
  <text x="90" y="115" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#64748b">I (Epidermal)</text>
  <text x="250" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#475569">II (Subsidiary)</text>
  <text x="250" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">III (Pore)</text>
  <text x="145" y="165" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#15803d">IV (Guard Cells)</text>
  <text x="250" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803d">Gaseous Exchange &amp; Transpiration Regulated by Guard Cells (IV)</text>
</svg>