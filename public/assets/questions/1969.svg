<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 440" width="460" height="440">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b87638"/>
      <stop offset="100%" stop-color="#8c5420"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4e6e8"/>
      <stop offset="100%" stop-color="#8d9297"/>
    </linearGradient>
    <clipPath id="headerClip">
      <path d="M 30,68 Q 30,26 72,26 L 388,26 Q 430,26 430,68 L 430,126 L 30,126 Z"/>
    </clipPath>
  </defs>

  <!-- White background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Outer calendar base / stacked pages effect -->
  <rect x="26" y="24" width="408" height="392" rx="44" ry="44" fill="url(#baseGrad)" stroke="#686c70" stroke-width="3"/>

  <!-- White inner page -->
  <rect x="30" y="126" width="400" height="258" rx="28" ry="28" fill="#ffffff" stroke="#8a8e93" stroke-width="2"/>
  <rect x="30" y="126" width="400" height="36" fill="#ffffff"/>

  <!-- Top brown header -->
  <g clip-path="url(#headerClip)">
    <rect x="30" y="26" width="400" height="100" fill="url(#headerGrad)"/>
    <!-- Subtle top highlight -->
    <path d="M 42,66 Q 42,36 74,36 L 386,36 Q 418,36 418,66" fill="none" stroke="#d89d60" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
  </g>
  <path d="M 30,68 Q 30,26 72,26 L 388,26 Q 430,26 430,68 L 430,126 L 30,126 Z" fill="none" stroke="#4d2c0f" stroke-width="3"/>

  <!-- Header text: AUGUST 20XX -->
  <text x="230" y="95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" fill="#ffffff" letter-spacing="1">
    <tspan font-weight="bold">AUGUST </tspan><tspan font-weight="normal" fill="#f7eedc">20XX</tspan>
  </text>

  <!-- Weekday header row (x=48 to 412, width=364 => 7 cols * 52px) -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <rect x="48" y="138" width="52" height="28" fill="#8b261d" stroke="#ffffff" stroke-width="1"/>
    <text x="74" y="157">SUN</text>

    <rect x="100" y="138" width="52" height="28" fill="#464b53" stroke="#ffffff" stroke-width="1"/>
    <text x="126" y="157">MON</text>

    <rect x="152" y="138" width="52" height="28" fill="#464b53" stroke="#ffffff" stroke-width="1"/>
    <text x="178" y="157">TUE</text>

    <rect x="204" y="138" width="52" height="28" fill="#464b53" stroke="#ffffff" stroke-width="1"/>
    <text x="230" y="157">WED</text>

    <rect x="256" y="138" width="52" height="28" fill="#464b53" stroke="#ffffff" stroke-width="1"/>
    <text x="282" y="157">THU</text>

    <rect x="308" y="138" width="52" height="28" fill="#464b53" stroke="#ffffff" stroke-width="1"/>
    <text x="334" y="157">FRI</text>

    <rect x="360" y="138" width="52" height="28" fill="#464b53" stroke="#ffffff" stroke-width="1"/>
    <text x="386" y="157">SAT</text>
  </g>

  <!-- Calendar Grid (5 rows * 40px = 200px, y=166 to 366) -->
  <g stroke="#9ca0a5" stroke-width="1.5" fill="none">
    <rect x="48" y="166" width="364" height="200"/>
    <!-- Vertical lines -->
    <line x1="100" y1="166" x2="100" y2="366"/>
    <line x1="152" y1="166" x2="152" y2="366"/>
    <line x1="204" y1="166" x2="204" y2="366"/>
    <line x1="256" y1="166" x2="256" y2="366"/>
    <line x1="308" y1="166" x2="308" y2="366"/>
    <line x1="360" y1="166" x2="360" y2="366"/>
    <!-- Horizontal lines -->
    <line x1="48" y1="206" x2="412" y2="206"/>
    <line x1="48" y1="246" x2="412" y2="246"/>
    <line x1="48" y1="286" x2="412" y2="286"/>
    <line x1="48" y1="326" x2="412" y2="326"/>
  </g>

  <!-- Dates -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1a1a1a" text-anchor="middle">
    <!-- Row 1 -->
    <text x="126" y="194">1</text>
    <text x="178" y="194">2</text>
    <text x="230" y="194">3</text>
    <text x="282" y="194">4</text>
    <text x="334" y="194">5</text>
    <text x="386" y="194">6</text>

    <!-- Row 2 -->
    <text x="74" y="234">7</text>
    <text x="126" y="234">8</text>
    <text x="178" y="234">9</text>
    <text x="230" y="234">10</text>
    <text x="282" y="234">11</text>
    <text x="334" y="234">12</text>
    <text x="386" y="234">13</text>

    <!-- Row 3 -->
    <text x="74" y="274">14</text>
    <text x="126" y="274">15</text>
    <text x="178" y="274">16</text>
    <text x="230" y="274">17</text>
    <text x="282" y="274">18</text>
    <text x="334" y="274">19</text>
    <text x="386" y="274">20</text>

    <!-- Row 4 -->
    <text x="74" y="314">21</text>
    <text x="126" y="314">22</text>
    <text x="178" y="314">23</text>
    <text x="230" y="314">24</text>
    <text x="282" y="314">25</text>
    <text x="334" y="314">26</text>
    <text x="386" y="314">27</text>

    <!-- Row 5 -->
    <text x="74" y="354">28</text>
    <text x="126" y="354">29</text>
    <text x="178" y="354">30</text>
    <text x="230" y="354">31</text>
  </g>
</svg>
