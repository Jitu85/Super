<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <rect width="500" height="320" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Triangular Glass Prism ABC -->
  <polygon points="250,50 110,260 390,260" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text x="245" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0284c7">A</text>
  <text x="90" y="270" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0284c7">B</text>
  <text x="400" y="270" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0284c7">C</text>
  <!-- Incident Ray PE -->
  <line x1="40" y1="210" x2="175" y2="160" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="115,182 105,178 110,189" fill="#dc2626"/>
  <!-- Refracted Ray EF -->
  <line x1="175" y1="160" x2="325" y2="160" stroke="#dc2626" stroke-width="2.5"/>
  <!-- Emergent Ray FS -->
  <line x1="325" y1="160" x2="450" y2="230" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="390,197 380,192 384,203" fill="#dc2626"/>
  <!-- Normal at E -->
  <line x1="130" y1="100" x2="220" y2="220" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Normal at F -->
  <line x1="370" y1="100" x2="280" y2="220" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Undeviated paths (dotted) -->
  <line x1="175" y1="160" x2="310" y2="110" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="325" y1="160" x2="245" y2="115" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Angle labels -->
  <!-- 1: Angle of Incidence -->
  <text x="120" y="145" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#dc2626">1 (∠i)</text>
  <!-- 6: Angle of Deviation -->
  <text x="270" y="105" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#7c3aed">6 (∠D)</text>
  <text x="250" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#334155">1 = Angle of incidence, 6 = Angle of deviation</text>
</svg>