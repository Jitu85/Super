<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <polygon points="60,140 170,40 260,140" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="80" y="135" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e40af">55°</text>
  <text x="225" y="135" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e40af">65°</text>
  <text x="170" y="65" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#dc2626">? = 60°</text>
  <text x="160" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">Sum of angles in a triangle = 180°</text>
</svg>