<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="50" y="45" width="220" height="80" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="160" y="35" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#15803d">Length = 8 m</text>
  <text x="35" y="90" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#15803d">Width = 3 m</text>
  <text x="160" y="92" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#166534">Area = 8 × 3 = 24 m²</text>
  <text x="160" y="155" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">Perimeter = 2 × (8 + 3) = 22 m</text>
</svg>