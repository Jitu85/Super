<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 150" width="820" height="150">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- Plate 1 with ice cubes -->
  <g transform="translate(140, 82)">
    <ellipse cx="0" cy="0" rx="100" ry="34" fill="#eef4f7" stroke="#2c3e50" stroke-width="2"/>
    <ellipse cx="0" cy="-2" rx="76" ry="22" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5"/>
    <rect x="-44" y="-22" width="26" height="22" rx="3" fill="#b8e2f2" stroke="#3c7a96" stroke-width="1.8"/>
    <rect x="-14" y="-28" width="28" height="24" rx="3" fill="#cdebf7" stroke="#3c7a96" stroke-width="1.8"/>
    <rect x="18" y="-20" width="26" height="20" rx="3" fill="#b8e2f2" stroke="#3c7a96" stroke-width="1.8"/>
  </g>
  <!-- Arrow 1 -->
  <line x1="255" y1="80" x2="295" y2="80" stroke="#222222" stroke-width="2.5"/>
  <polygon points="295,74 307,80 295,86" fill="#222222"/>

  <!-- Plate 2 with water puddle -->
  <g transform="translate(415, 82)">
    <ellipse cx="0" cy="0" rx="100" ry="34" fill="#eef4f7" stroke="#2c3e50" stroke-width="2"/>
    <ellipse cx="0" cy="-2" rx="76" ry="22" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5"/>
    <ellipse cx="0" cy="-2" rx="56" ry="15" fill="#9bd4eb" stroke="#3c7a96" stroke-width="1.5" opacity="0.85"/>
  </g>
  <!-- Arrow 2 -->
  <line x1="530" y1="80" x2="570" y2="80" stroke="#222222" stroke-width="2.5"/>
  <polygon points="570,74 582,80 570,86" fill="#222222"/>

  <!-- Plate 3 empty -->
  <g transform="translate(690, 82)">
    <ellipse cx="0" cy="0" rx="100" ry="34" fill="#eef4f7" stroke="#2c3e50" stroke-width="2"/>
    <ellipse cx="0" cy="-2" rx="76" ry="22" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5"/>
  </g>
</svg>