<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <rect width="500" height="320" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Compass Rose on top-right -->
  <g transform="translate(420, 80)">
    <circle cx="0" cy="0" r="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#1e293b" stroke-width="2"/>
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#1e293b" stroke-width="2"/>
    <polygon points="0,-28 -5,-15 5,-15" fill="#ef4444"/>
    <text x="0" y="-34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ef4444">N</text>
    <text x="0" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e293b">S</text>
    <text x="36" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e293b">E</text>
    <text x="-36" y="4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e293b">W</text>
  </g>
  <!-- Horizontal Wire from East to West -->
  <!-- Wire from (400, 160) to (80, 160) -->
  <line x1="420" y1="160" x2="80" y2="160" stroke="#b45309" stroke-width="7" stroke-linecap="round"/>
  <!-- Current Arrow pointing East to West (right to left) -->
  <polygon points="70,160 90,150 90,170" fill="#dc2626"/>
  <text x="80" y="140" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#dc2626">Current I (East → West)</text>
  <text x="430" y="165" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#b45309">East</text>
  <text x="40" y="165" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#b45309">West</text>
  <!-- Points Above and Below wire -->
  <circle cx="250" cy="110" r="5" fill="#2563eb"/>
  <text x="260" y="115" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2563eb">Point Above (Field: South → North)</text>
  <circle cx="250" cy="210" r="5" fill="#16a34a"/>
  <text x="260" y="215" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#16a34a">Point Below (Field: North → South)</text>
  <!-- Circular magnetic field lines -->
  <ellipse cx="250" cy="160" rx="40" ry="70" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="250" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#16a34a">By Right-Hand Thumb Rule: Magnetic Field is North to South directly below the wire</text>
</svg>