<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <rect width="500" height="320" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Grid -->
  <defs>
    <pattern id="grid1442" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="500" height="320" fill="url(#grid1442)"/>
  <!-- Axes -->
  <line x1="40" y1="160" x2="460" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="290" x2="250" y2="30" stroke="#334155" stroke-width="2"/>
  <!-- Arrows -->
  <polygon points="465,160 455,155 455,165" fill="#334155"/>
  <polygon points="35,160 45,155 45,165" fill="#334155"/>
  <polygon points="250,25 245,35 255,35" fill="#334155"/>
  <polygon points="250,295 245,285 255,285" fill="#334155"/>
  <!-- Labels -->
  <text x="475" y="165" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">X</text>
  <text x="20" y="165" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">X'</text>
  <text x="255" y="22" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Y</text>
  <text x="255" y="310" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Y'</text>
  <text x="235" y="178" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">O</text>
  <!-- Curve y = p(x) with 5 real roots -->
  <!-- Crossings at x = 70, 140, 220, 310, 410 -->
  <path d="M 50,270 C 60,200 65,170 70,160 C 80,140 100,70 115,70 C 130,70 135,130 140,160 C 148,200 170,260 190,260 C 205,260 215,190 220,160 C 230,100 255,50 275,50 C 295,50 305,120 310,160 C 320,230 350,270 375,270 C 395,270 405,190 410,160 C 418,110 435,50 445,40" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 5 Intersection Points -->
  <circle cx="70" cy="160" r="5" fill="#ef4444"/>
  <circle cx="140" cy="160" r="5" fill="#ef4444"/>
  <circle cx="220" cy="160" r="5" fill="#ef4444"/>
  <circle cx="310" cy="160" r="5" fill="#ef4444"/>
  <circle cx="410" cy="160" r="5" fill="#ef4444"/>
  <text x="350" y="45" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#2563eb">y = p(x)</text>
</svg>