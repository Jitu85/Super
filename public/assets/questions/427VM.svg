<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <polygon points="50,140 160,35 270,140" fill="#fef2f2" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/>
  <text x="75" y="135" font-family="sans-serif" font-size="12" font-weight="700" fill="#991b1b">50°</text>
  <text x="235" y="135" font-family="sans-serif" font-size="12" font-weight="700" fill="#991b1b">70°</text>
  <text x="160" y="65" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#b91c1c">Third ∠ = 60°</text>
  <text x="160" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">Triangular Road Sign (50° + 70° + 60° = 180°)</text>
</svg>