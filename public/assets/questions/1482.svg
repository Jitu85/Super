<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <rect width="500" height="320" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Circle centre O(320, 160), radius 90 -->
  <circle cx="320" cy="160" r="90" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <!-- External Point P(70, 160) -->
  <!-- Tangent contact points: OP = 250, r = 90. sin(theta) = 90/250 = 0.36. theta = 21.1 deg -->
  <!-- For ∠APB = 80 deg, half angle = 40 deg. So let's draw with APB = 80 deg geometrically: -->
  <!-- A at (250, 75), B at (250, 245) -->
  <line x1="70" y1="160" x2="262" y2="76" stroke="#2563eb" stroke-width="3"/>
  <line x1="70" y1="160" x2="262" y2="244" stroke="#2563eb" stroke-width="3"/>
  <!-- Chord AB -->
  <line x1="262" y1="76" x2="262" y2="244" stroke="#d97706" stroke-width="2.5" stroke-dasharray="4,4"/>
  <!-- Centre O and radii -->
  <circle cx="320" cy="160" r="4" fill="#1e293b"/>
  <line x1="320" y1="160" x2="262" y2="76" stroke="#64748b" stroke-width="1.5"/>
  <line x1="320" y1="160" x2="262" y2="244" stroke="#64748b" stroke-width="1.5"/>
  <!-- Points -->
  <circle cx="70" cy="160" r="5" fill="#1e293b"/>
  <circle cx="262" cy="76" r="5" fill="#1e293b"/>
  <circle cx="262" cy="244" r="5" fill="#1e293b"/>
  <!-- Labels -->
  <text x="50" y="165" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">P</text>
  <text x="265" y="65" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">A</text>
  <text x="265" y="265" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">B</text>
  <text x="330" y="165" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">O</text>
  <!-- Angle at P = 80 deg -->
  <path d="M 120,138 A 55 55 0 0 1 120,182" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="130" y="165" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ef4444">80°</text>
  <!-- Angle PAB label -->
  <text x="215" y="105" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#d97706">∠PAB = ?</text>
</svg>