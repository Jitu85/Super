<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" width="960" height="150">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="10" y="10" width="940" height="130" fill="#ffffff" stroke="#222222" stroke-width="2.5"/>
  <!-- 1. Wheat bowl -->
  <g transform="translate(75, 75)" stroke="#3d2b14" stroke-width="1.8">
    <path d="M-40,-4 C-40,26 40,26 40,-4 Z" fill="#c79558"/>
    <ellipse cx="0" cy="-4" rx="40" ry="14" fill="#d9b473"/>
    <text x="0" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111" stroke="none">Wheat</text>
  </g>
  <!-- 2. Potato -->
  <g transform="translate(195, 75)">
    <ellipse cx="0" cy="4" rx="42" ry="24" fill="#c79a5b" stroke="#593e18" stroke-width="2"/>
    <circle cx="-16" cy="-4" r="2" fill="#7a5624"/>
    <circle cx="14" cy="10" r="2" fill="#7a5624"/>
    <circle cx="22" cy="-6" r="1.5" fill="#7a5624"/>
  </g>
  <!-- 3. Sugar bowl -->
  <g transform="translate(315, 75)" stroke="#222222" stroke-width="1.8">
    <path d="M-38,-2 C-36,24 36,24 38,-2 Z" fill="#464b52"/>
    <ellipse cx="0" cy="-2" rx="38" ry="12" fill="#ffffff"/>
    <path d="M-24,-4 Q0,-22 24,-4 Z" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
    <text x="0" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111111" stroke="none">Sugar</text>
  </g>
  <!-- 4. Egg -->
  <g transform="translate(425, 75)">
    <path d="M0,-36 C16,-36 26,-10 26,10 C26,28 14,38 0,38 C-14,38 -26,28 -26,10 C-26,-10 -16,-36 0,-36 Z" fill="#f5ebd9" stroke="#6e5c49" stroke-width="2"/>
  </g>
  <!-- 5. Butter -->
  <g transform="translate(540, 78)" stroke="#4a3812" stroke-width="1.8" stroke-linejoin="round">
    <polygon points="-38,14 38,14 48,26 -28,26" fill="#d9dfe6"/>
    <polygon points="-28,-8 22,-8 22,14 -28,14" fill="#f7dc6f"/>
    <polygon points="-28,-8 -14,-18 36,-18 22,-8" fill="#fae588"/>
    <polygon points="22,-8 36,-18 36,4 22,14" fill="#e6c34c"/>
    <text x="-3" y="7" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4a3812" stroke="none">BUTTER</text>
  </g>
  <!-- 6. Oil bottle -->
  <g transform="translate(650, 75)" stroke="#3d2c0a" stroke-width="1.8">
    <rect x="-7" y="-48" width="14" height="10" fill="#444444"/>
    <path d="M-7,-38 L-16,-16 L-16,38 L16,38 L16,-16 L7,-38 Z" fill="#e6b835"/>
    <rect x="-14" y="-6" width="28" height="20" fill="#ffffff" stroke="#7a5e18" stroke-width="1"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#111111" stroke="none">OIL</text>
  </g>
  <!-- 7. Carrot -->
  <g transform="translate(765, 75) rotate(-32)" stroke="#4a2208" stroke-width="1.8" stroke-linejoin="round">
    <path d="M-46,0 C-46,-12 -24,-12 42,0 C-24,12 -46,12 -46,0 Z" fill="#eb6e24"/>
    <path d="M42,0 L56,-10 M42,0 L58,0 M42,0 L54,10" fill="none" stroke="#427a26" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- 8. Mango -->
  <g transform="translate(880, 75)">
    <path d="M-6,-36 C18,-38 30,-16 26,10 C22,32 4,42 -12,34 C-26,26 -24,6 -20,-10 C-16,-24 -16,-34 -6,-36 Z" fill="#f0b637" stroke="#6e4b0a" stroke-width="2"/>
  </g>
</svg>