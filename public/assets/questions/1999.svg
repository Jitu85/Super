<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <rect x="10" y="10" width="340" height="200" rx="8" fill="#ffffff" stroke="#888888" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="180" y="48">Gas</text>
    <text x="72" y="178">Liquid</text>
    <text x="288" y="178">Solid</text>
  </g>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#111111"/>
    </marker>
  </defs>
  <!-- a: Gas -> Liquid -->
  <line x1="146" y1="60" x2="78" y2="146" stroke="#111111" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- b: Liquid -> Gas -->
  <line x1="94" y1="154" x2="162" y2="68" stroke="#111111" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- c: Liquid -> Solid -->
  <line x1="120" y1="164" x2="242" y2="164" stroke="#111111" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- d: Solid -> Liquid -->
  <line x1="242" y1="178" x2="120" y2="178" stroke="#111111" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- e: Solid -> Gas -->
  <line x1="274" y1="148" x2="206" y2="62" stroke="#111111" stroke-width="2.5" marker-end="url(#arr)"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#111111" text-anchor="middle">
    <text x="98" y="96">a</text>
    <text x="142" y="122">b</text>
    <text x="181" y="156">c</text>
    <text x="181" y="198">d</text>
    <text x="256" y="102">e</text>
  </g>
</svg>