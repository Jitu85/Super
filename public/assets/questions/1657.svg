<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <rect width="500" height="320" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="2"/>
  <!-- Inscribed Circle -->
  <circle cx="250" cy="160" r="80" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <!-- Circumscribing Quadrilateral PQRS -->
  <polygon points="120,60 380,60 410,260 90,260" fill="none" stroke="#1e293b" stroke-width="3"/>
  <!-- Points of contact A on PQ, B on QR, C on RS, D on SP -->
  <circle cx="250" cy="60" r="4.5" fill="#ef4444"/>
  <circle cx="395" cy="160" r="4.5" fill="#ef4444"/>
  <circle cx="250" cy="260" r="4.5" fill="#ef4444"/>
  <circle cx="105" cy="160" r="4.5" fill="#ef4444"/>
  <!-- Vertices -->
  <text x="105" y="50" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">P</text>
  <text x="390" y="50" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">Q</text>
  <text x="420" y="270" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">R</text>
  <text x="70" y="270" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1e293b">S</text>
  <!-- Contact Labels -->
  <text x="245" y="50" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ef4444">A</text>
  <text x="405" y="165" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ef4444">B</text>
  <text x="245" y="280" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ef4444">C</text>
  <text x="85" y="165" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ef4444">D</text>
  <text x="250" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2563eb">PA + CS = PD + DS = PS</text>
</svg>