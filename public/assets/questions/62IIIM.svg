<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" width="100%" height="100%">
  <rect width="340" height="180" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Square -->
  <rect x="50" y="45" width="75" height="75" rx="2" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <polyline points="50,57 62,57 62,45" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="87" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e40af">Square</text>
  <text x="87" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">4 equal sides, 4 right angles</text>
  <!-- Rhombus -->
  <polygon points="245,40 290,82 245,124 200,82" fill="#fef3c7" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/>
  <text x="245" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#92400e">Rhombus</text>
  <text x="245" y="162" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">4 equal sides, opposite angles equal</text>
</svg>