name: Render Keep-Alive Pinger

on:
  schedule:
    # Runs every 14 minutes (UTC) to prevent Render from entering sleep state
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Talent Hunt Health Endpoint
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://super-u1kq.onrender.com/api/health)
          echo "Health check HTTP status: $RESPONSE"
          if [ "$RESPONSE" -eq 200 ]; then
            echo "Render service is awake and healthy!"
          else
            echo "Service returned code $RESPONSE - awakening or initializing..."
          fi

